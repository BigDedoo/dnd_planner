services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: dnd_planner
      POSTGRES_USER: dnd_planner
      POSTGRES_PASSWORD: dnd_planner_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dnd_planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd_planner -d dnd_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dnd_planner_pgdata:
