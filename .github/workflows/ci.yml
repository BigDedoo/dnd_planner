name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://dnd_planner:dnd_planner_local_only@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: dnd_planner
          POSTGRES_USER: dnd_planner
          POSTGRES_PASSWORD: dnd_planner_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd_planner -d dnd_planner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Synchronize Python dependencies
        run: uv sync --frozen

      - name: Lint backend
        run: uv run ruff check backend

      - name: Check backend formatting
        run: uv run ruff format --check backend

      - name: Test legacy SQLite backend
        run: uv run pytest -q --ignore=backend/tests/postgres

      - name: Test PostgreSQL models and migrations
        env:
          PHASE1A_REQUIRE_POSTGRES: "1"
        run: uv run pytest -q backend/tests/postgres

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_UPSTREAM_URL: http://127.0.0.1:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
